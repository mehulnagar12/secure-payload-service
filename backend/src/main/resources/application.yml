spring:
  application:
    name: secure-payload-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

logging:
  pattern:
    level: "%5p [request_id:%X{request_id:-none}]"

secure-payload:
  topic: ${SECURE_PAYLOAD_TOPIC:secure-payload-events}
  kafka-send-timeout: 5s
  private-key-resource: ${SECURE_PAYLOAD_PRIVATE_KEY_RESOURCE:classpath:mock-private-key.der.b64}
  key-id: ${SECURE_PAYLOAD_KEY_ID:sandbox-rsa-2026-01}
  rate-limit-backend: ${SECURE_PAYLOAD_RATE_LIMIT_BACKEND:mock}
  idempotency-backend: ${SECURE_PAYLOAD_IDEMPOTENCY_BACKEND:mock}
  allowed-origin: ${SECURE_PAYLOAD_ALLOWED_ORIGIN:http://localhost:5173}
